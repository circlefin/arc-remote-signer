public:
  server:
    host: 0.0.0.0
    port: 10340
    # tls secures the malachite -> sidecar gRPC connection. Disabled by default.
    # When enabled, cert and key must point to a PEM-encoded X509 key pair.
    tls:
      enabled: false
      cert: ""
      key: ""
      # clientAuth upgrades server-authenticated TLS to mutual TLS. Use a
      # dedicated CA that issues certificates only to authorized clients.
      clientAuth:
        enabled: false
        ca: ""
    reflection:
      enabled: false
service:
  signer:
    keyId: "00000000-0000-0000-0000-000000000000"
    algorithm: "ed25519"
provider: # config for external services
  secrets:
    localstack:
      enabled: false
      endpoint: http://localhost:4566
      region: us-east-1
  enclave:
    nitroEnclave:
      enabled: false  # Set to true in production with Nitro Enclave (uses VSOCK)
      cid: 16         # Enclave CID (typically 16 for first enclave)
      port: 10350     # Port the enclave server listens on
    client:
      name: "enclave"
      baseURL: localhost:10350  # Used when nitroEnclave.enabled=false (TCP gRPC target)
      retry:
        maxAttempts: 1
      requestTimeoutMS: 500
  awskms:
    localstack:
      enabled: false
    arns:
profiler:
  # These are the dev values.  Even if we didn't want to specify dev values, we would still have to specify
  # the structure here so Viper knows to look for them in environment variables
  enabled: true
metrics:
  statsd:
    host: 127.0.0.1
    port: 8125
    telemetryDisabled: true
  # prometheus exposes a /metrics HTTP endpoint with gRPC server metrics
  # (request totals by method/status code and handling latency) plus Go runtime
  # and process collectors. Disabled by default.
  prometheus:
    enabled: false
    host: 0.0.0.0
    port: 9090
    path: /metrics
# vsockproxy configures the standalone host-side bridge process started via
# `app run-vsockproxy`. `app run` ignores this block. The transport is
# selected by provider.enclave.nitroEnclave.enabled above (shared with the
# app process). Override fields with APP_VSOCKPROXY_* environment variables.
vsockproxy:
  basePort: 10316
  maxConns: 50
  # Standard AWS KMS requests use the ARN regions as an allowlist.
  # LocalStack requests use the fixed compose service endpoint.
